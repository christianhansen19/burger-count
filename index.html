      @keyframes bfall {
        0%   { transform: translate(0, -12vh) rotate(0deg); opacity: 0; }
        8%   { opacity: 1; }

      @keyframes rise {
        from { transform: translateY(14px); opacity: 0; }
        to   { transform: translateY(0); opacity: 1; }
      }
      @keyframes wiggle {
        0%, 100% { transform: rotate(-4deg); }
